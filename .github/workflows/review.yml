name: Code review

# Reviews the day's upstream commits, one agent session per commit.
#
# claude-code-action runs one session per invocation, so the loop is a matrix rather
# than a single prompt over 25 commits: bounded context each time, nothing skimmed at
# the end of the batch, and a commit that blows up does not take the day with it.
#
# Runs after the daily fetch, so data/raw/<edition>.json exists.

on:
  schedule:
    - cron: '15 5 * * *'      # after the 04:30 fetch
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition date (YYYY-MM-DD, default: today UTC)'
        required: false
      model:
        description: 'Model for the review'
        required: false
      thinking:
        description: 'MAX_THINKING_TOKENS — the biggest cost knob'
        required: false
      shas:
        description: 'Review these commits instead of the edition (comma-separated). For measuring recall on commits whose bug is already known.'
        required: false
      reverse:
        description: 'Review each commit backwards: the diff that would have introduced what it fixed. Detection test.'
        type: boolean
        default: false
      max_turns:
        description: 'Per-commit turn cap (default 30). Reverse mode needs more: with no commit message there is no hint to follow.'
        required: false

permissions:
  contents: read

concurrency:
  group: mormot2-review
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      edition: ${{ steps.plan.outputs.edition }}
      shas: ${{ steps.plan.outputs.shas }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Check out the upstream tree at the edition head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/synopse/mORMot2 upstream
          git -C upstream fetch --depth 200 origin master
          # Pin the tree here, before the loop below moves FETCH_HEAD. The graph is
          # built once at the day's head; which commit that is must not depend on
          # what was typed into the `shas` box.
          git -C upstream checkout --detach FETCH_HEAD
          # A commit named explicitly is usually far outside the 200-commit window:
          # that is the point of naming it. Fetch each one and its parent.
          # GitHub only serves a fetch by *full* sha, so expand the abbreviation
          # first -- `git fetch origin b61d9db` answers "couldn't find remote ref".
          for ref in $(echo "${{ inputs.shas }}" | tr ',' ' '); do
            full=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
                     "https://api.github.com/repos/synopse/mORMot2/commits/$ref" \
                   | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])') \
              || { echo "::error::$ref is not a commit of synopse/mORMot2"; exit 1; }
            echo "$ref -> $full"
            git -C upstream fetch --depth 2 origin "$full" \
              || { echo "::error::cannot fetch $full from upstream"; exit 1; }
          done

      - name: List the commits to review
        id: plan
        run: |
          ED="${{ inputs.edition }}"; [ -n "$ED" ] || ED=$(date -u +%F)
          echo "edition=$ED" >> "$GITHUB_OUTPUT"
          python - "$ED" "${{ inputs.shas }}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, subprocess, sys
          edition, explicit = sys.argv[1], sys.argv[2].strip()
          if explicit:
              # Resolve here so the matrix, the contexts and the findings all name the
              # same full sha, whatever abbreviation was typed into the dispatch form.
              shas = []
              for ref in (r.strip() for r in explicit.split(",")):
                  if ref:
                      shas.append(subprocess.run(
                          ["git", "-C", "upstream", "rev-parse", "--verify",
                           f"{ref}^{{commit}}"],
                          capture_output=True, text=True, check=True).stdout.strip())
          else:
              raw = json.loads(pathlib.Path(f"data/raw/{edition}.json").read_text())
              shas = [c["sha"] for c in raw["commits"] if not c.get("is_merge")]
          print(f"shas={json.dumps(shas)}")
          print(f"count={len(shas)}")
          PY

      # Opt-in: set the REVIEW_TOKENSAVE repository variable to 'true'. Off by
      # default so the first measured week has a plain baseline — turning it on later
      # and comparing is the only way to know what the graph actually changes.
      - name: Cache the patched tokensave binary
        if: vars.REVIEW_TOKENSAVE == 'true'
        id: ts-bin
        uses: actions/cache@v4
        with:
          path: tokensave-bin/tokensave
          key: tokensave-${{ vars.REVIEW_TOKENSAVE_REF || 'main' }}-${{ hashFiles('ci/tokensave-inc.py') }}

      - name: Clone, patch and build tokensave
        if: vars.REVIEW_TOKENSAVE == 'true' && steps.ts-bin.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 \
            ${{ vars.REVIEW_TOKENSAVE_REF && format('--branch {0}', vars.REVIEW_TOKENSAVE_REF) || '' }} \
            https://github.com/aovestdipaperino/tokensave.git tokensave-src
          # .inc files are Object Pascal here: 11% of src/, and the whole posix/windows
          # layer. See ci/README.md, including why this must not go upstream as is.
          # A script rather than a diff: tokensave's extension lists move, and a
          # context diff that stops applying fails the run for an unrelated reason.
          python ci/tokensave-inc.py tokensave-src
          cd tokensave-src
          cargo build --release --features medium
          mkdir -p ../tokensave-bin && cp target/release/tokensave ../tokensave-bin/

      - name: Index the upstream tree
        if: vars.REVIEW_TOKENSAVE == 'true' && steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          export PATH="$PWD/tokensave-bin:$PATH"
          cd upstream
          # A fresh index every run, on purpose. Indexing this tree is a few seconds,
          # so caching the database would buy nothing and cost a moving part: a stale
          # or half-written database restored from another build is a whole class of
          # bug that simply cannot happen here. `time` so the first run tells us what
          # it actually costs on a runner rather than on a workstation.
          time tokensave init 2>&1 | tee "$RUNNER_TEMP/tokensave-init.log"
          du -sh .tokensave

      # Read it off the indexer's own report rather than a query: the CLI verbs move
      # (`callers` was one, then it was not) and a probe that breaks on a renamed
      # subcommand says nothing about the graph. tokensave lists every extension it
      # skipped -- .inc appearing there is the failure we care about.
      - name: Check the .inc files made it into the graph
        if: vars.REVIEW_TOKENSAVE == 'true' && steps.plan.outputs.count != '0'
        continue-on-error: true
        run: |
          log="$RUNNER_TEMP/tokensave-init.log"
          grep -E 'indexing done|Skipped' "$log" || true
          if grep -qE '\.inc \(' "$log"; then
            echo "::warning::.inc was skipped -- ci/tokensave-inc.py did not take"
            exit 1
          fi
          echo ".inc is not in the skipped list: the patch took"

      - name: Build one context per commit
        if: steps.plan.outputs.count != '0'
        run: |
          SHAS=$(python -c 'import json,sys; print(",".join(json.loads(sys.argv[1])))' \
                 '${{ steps.plan.outputs.shas }}')
          python scripts/run_review.py \
            --edition "${{ steps.plan.outputs.edition }}" --shas "$SHAS" \
            ${{ inputs.reverse && '--reverse' || '' }} \
            --clone upstream --prepare contexts/

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.count != '0'
        with: { name: review-contexts, path: contexts/ }

      - uses: actions/upload-artifact@v4
        if: vars.REVIEW_TOKENSAVE == 'true' && steps.plan.outputs.count != '0'
        with: { name: tokensave-graph, path: upstream/.tokensave/ }

  review:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one bad commit must not cancel the others
      max-parallel: 4           # keep a lid on concurrent plan usage
      matrix:
        sha: ${{ fromJson(needs.plan.outputs.shas) }}
    permissions:
      contents: read
      id-token: write           # claude-code-action's GitHub App authentication
    steps:
      - uses: actions/checkout@v4     # must precede the action: the skill lives in the repo

      - name: Check out mORMot2 at this commit
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/synopse/mORMot2 upstream
          git -C upstream fetch --depth 50 origin ${{ matrix.sha }}
          git -C upstream checkout --detach \
            ${{ inputs.reverse && format('{0}^', matrix.sha) || matrix.sha }}
          echo "REVIEW_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with: { name: review-contexts, path: contexts/ }

      # The graph is built once at the day's head and reused by every job. Callers
      # barely move within a day, and re-indexing 572k lines per commit would cost
      # more than it saves.
      - name: Restore the code graph
        if: vars.REVIEW_TOKENSAVE == 'true'
        uses: actions/download-artifact@v4
        with: { name: tokensave-graph, path: upstream/.tokensave/ }

      - name: Restore the patched tokensave binary
        if: vars.REVIEW_TOKENSAVE == 'true'
        uses: actions/cache@v4
        with:
          path: tokensave-bin/tokensave
          key: tokensave-${{ vars.REVIEW_TOKENSAVE_REF || 'main' }}-${{ hashFiles('ci/tokensave-inc.py') }}

      - name: Point Claude Code at the graph
        if: vars.REVIEW_TOKENSAVE == 'true'
        run: |
          chmod +x tokensave-bin/tokensave
          cat > .mcp.json <<JSON
          { "mcpServers": { "tokensave": {
              "command": "$PWD/tokensave-bin/tokensave", "args": ["serve"],
              "cwd": "$PWD/upstream" } } }
          JSON

      - name: Review this commit
        uses: anthropics/claude-code-action@v1
        env:
          REVIEW_OUTPUT: ${{ github.workspace }}/parts/${{ matrix.sha }}.json
          MAX_THINKING_TOKENS: ${{ inputs.thinking || vars.REVIEW_THINKING || '8000' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /mormot-review
          claude_args: >-
            --max-turns ${{ inputs.max_turns || vars.REVIEW_MAX_TURNS || '30' }}
            --model ${{ inputs.model || vars.REVIEW_MODEL || 'claude-sonnet-5' }}
            --allowedTools "Read,Grep,Glob,Bash,Write${{ vars.REVIEW_TOKENSAVE == 'true' && ',mcp__tokensave__tokensave_callers,mcp__tokensave__tokensave_callees,mcp__tokensave__tokensave_affected,mcp__tokensave__tokensave_diff_context' || '' }}"
            ${{ vars.REVIEW_TOKENSAVE == 'true' && '--mcp-config .mcp.json' || '' }}

      # The action has no usage output, but Claude Code writes its execution log to
      # a known path under RUNNER_TEMP: turns, duration, cost, per-model usage. That
      # file is the per-commit consumption figure, and collecting it is the whole
      # point of the measured week.
      - name: Keep the execution log
        if: always()
        run: |
          mkdir -p parts
          log="$RUNNER_TEMP/claude-execution-output.json"
          if [ -f "$log" ]; then
            cp "$log" "parts/${{ matrix.sha }}.usage.json"
            python3 - "$log" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          r = d if isinstance(d, dict) else (d[-1] if d else {})
          for k in ("num_turns", "duration_ms", "total_cost_usd"):
              if k in r:
                  print(f"{k}: {r[k]}")
          PY
          else
            echo "::warning::no execution log at $log"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings-${{ matrix.sha }}
          path: parts/
          if-no-files-found: warn

  collect:
    needs: [plan, review]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet jsonschema

      - uses: actions/download-artifact@v4
        with: { pattern: findings-*, path: parts/, merge-multiple: true }

      - name: Merge the parts
        run: |
          SHAS=$(python -c 'import json,sys; print(",".join(json.loads(sys.argv[1])))' \
                 '${{ needs.plan.outputs.shas }}')
          python scripts/collect_findings.py \
            --edition "${{ needs.plan.outputs.edition }}" --parts parts/ --shas "$SHAS"

      - name: Commit the findings
        run: |
          git config user.name  "mormot2-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add` on a missing path is fatal under `bash -e`, and it failed the
          # whole step once after the review had already been paid for.
          git add data/findings
          if [ -d data/usage ]; then git add data/usage; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "review: findings for ${{ needs.plan.outputs.edition }}"
          git push origin HEAD:main

      - name: Re-check every quote against the source
        if: always()
        run: |
          python scripts/validate_findings.py \
            --edition "${{ needs.plan.outputs.edition }}"

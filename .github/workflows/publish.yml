name: Publish site

# Builds _site/ and deploys it to GitHub Pages. Called by the daily workflow right
# after the review is merged (a push made with GITHUB_TOKEN does not re-trigger
# workflows, so the deploy has to be invoked, not awaited), and on demand.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/heuristics.py'
      - 'scripts/common.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: python scripts/build_site.py --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

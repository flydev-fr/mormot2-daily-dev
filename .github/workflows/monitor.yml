name: Daily mORMot2 Monitor (Fetch Only)

on:
  schedule:
    - cron: '0 8 * * *' # Run daily at 08:00 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  fetch-commits:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Fetch Commits
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python fetch_commits.py

    - name: Upload Commits Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mormot2-commits-payload
        path: commits.json

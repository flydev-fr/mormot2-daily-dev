name: Validate analysis

# Runs on every pull request that touches an analysis file — including the ones
# Jules opens. A review that does not satisfy schema/analysis.schema.json fails
# here, and the daily workflow reads the same errors to ask for a repair.

on:
  pull_request:
    paths:
      - 'data/analysis/**'
      - 'schema/**'
      - 'scripts/**'
      - 'site/**'
  # Also on a direct push to main. A merge that lands without a pull request
  # would otherwise reach publish.yml unchecked, and the first sign of a broken
  # generator would be a failed deploy.
  push:
    branches: [main]
    paths:
      - 'data/analysis/**'
      - 'schema/**'
      - 'scripts/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet jsonschema

      - name: Validate every analysis payload
        run: python scripts/validate_analysis.py --all

      - name: Build the site (catches generator errors)
        run: python scripts/build_site.py --out /tmp/_site

      - name: Check the generated pages
        run: |
          test -s /tmp/_site/index.html
          test -s /tmp/_site/feed.xml
          test -s /tmp/_site/data.json
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET, json
          ET.parse('/tmp/_site/feed.xml')
          json.loads(pathlib.Path('/tmp/_site/data.json').read_text())
          print('site artefacts are well formed')
          PY

      # Pages live at two depths - / and /edition/ - so every relative href has
      # to carry the right base. Getting that wrong produces links that work on
      # the front page and 404 from a permalink, which no other check catches.
      - name: Check every internal link resolves
        run: |
          python - <<'PY'
          import pathlib, re, sys, urllib.parse
          root = pathlib.Path('/tmp/_site')
          bad, checked = [], 0
          for page in sorted(root.rglob('*.html')):
              html = page.read_text(encoding='utf-8')
              for href in sorted(set(re.findall(r'(?:href|src)="([^"]+)"', html))):
                  if href.startswith(('http://', 'https://', 'data:', 'mailto:', '#')):
                      continue
                  path = urllib.parse.unquote(href.split('#')[0].split('?')[0])
                  if not path:
                      continue
                  checked += 1
                  if not (page.parent / path).resolve().exists():
                      bad.append(f'{page.relative_to(root)} -> {href}')
          print(f'{checked} internal links checked')
          for b in bad:
              print('  BROKEN', b)
          sys.exit(1 if bad else 0)
          PY

      # A link or button inside <summary> is not reliably focusable or
      # activatable, and a click on it toggles the disclosure as often as it
      # does what it says. The entry rows are <details>, so this is easy to
      # reintroduce by adding a column that happens to contain a link.
      - name: Check no interactive element sits inside a summary
        run: |
          python - <<'PY'
          import pathlib, re, sys
          summary = re.compile(r'<summary\b.*?</summary>', re.S)
          interactive = re.compile(r'<(a\b[^>]*\bhref|button|input|select|textarea|details)\b', re.I)
          bad = []
          for page in sorted(pathlib.Path('/tmp/_site').rglob('*.html')):
              for block in summary.findall(page.read_text(encoding='utf-8')):
                  for tag in interactive.findall(block):
                      bad.append(f'{page.name}: <{tag.split()[0]}> inside <summary>')
          for b in sorted(set(bad)):
              print('  ' + b)
          print(f'{len(bad)} interactive elements inside <summary>')
          sys.exit(1 if bad else 0)
          PY
